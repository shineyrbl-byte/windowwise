<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An hour-by-hour plan for when to open your windows: cool your room for free and keep polluted air out." />
    <title>WindowWise</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip" href="#main" data-i18n="skip">Skip to content</a>
    <header class="top">
      <div class="wrap">
        <div class="brand-row">
          <p class="brand"><span class="logo" aria-hidden="true"></span>WindowWise</p>
          <div class="top-actions">
          <button type="button" id="install" class="ghost small-btn" data-i18n="install" hidden>📲 Install app</button>
          <label class="lang"><span class="sr-only" data-i18n="language">Language</span>
            <select id="lang" aria-label="Language / भाषा"></select>
          </label>
          </div>
        </div>
        <p class="tagline" data-i18n="tagline">Know when to open your windows: cool your room for free, keep bad air out.</p>
      </div>
    </header>

    <main id="main" class="wrap">
      <section class="card place" aria-labelledby="place-h">
        <h2 id="place-h" class="sr-only" data-i18n="choose_place">Choose a place</h2>
        <form id="search" class="search" role="search">
          <label for="q" class="sr-only" data-i18n="city_label">City or town</label>
          <input id="q" type="search" data-i18n-ph="search_ph" placeholder="Search your city or town" autocomplete="off" />
          <button type="submit" data-i18n="search">Search</button>
          <button type="button" id="locate" class="ghost" data-i18n="locate">Use my location</button>
        </form>
        <ul id="results" class="results" hidden></ul>
        <div id="saved" class="saved" hidden></div>
      </section>

      <details class="card settings">
        <summary data-i18n="settings">Your room &amp; preferences</summary>
        <div class="fields">
          <label><span data-i18n="start_indoor">Room temperature now (°C, optional)</span>
            <input id="startIndoor" type="number" step="0.5" min="0" max="50" data-i18n-ph="estimate" placeholder="Estimate" />
          </label>
          <label><span data-i18n="comfort_max">Keep the room under (°C)</span>
            <input id="comfortMax" type="number" step="0.5" min="15" max="40" />
          </label>
          <label><span data-i18n="comfort_min">Too cold below (°C)</span>
            <input id="comfortMin" type="number" step="0.5" min="0" max="30" />
          </label>
          <label><span data-i18n="sun_q">When does your window get direct sun?</span>
            <select id="sun">
              <option value="unsure" data-i18n="sun_unsure">Not sure</option>
              <option value="morning" data-i18n="sun_morning">Morning (faces east)</option>
              <option value="afternoon" data-i18n="sun_afternoon">Afternoon (faces west)</option>
              <option value="allday" data-i18n="sun_allday">Most of the day</option>
              <option value="shade" data-i18n="sun_shade">Hardly ever (shaded)</option>
            </select>
          </label>
          <label class="check">
            <input id="fan" type="checkbox" />
            <span data-i18n="fan">I have a fan running</span>
          </label>
          <label class="check">
            <input id="crossVent" type="checkbox" />
            <span data-i18n="cross_vent">My room has windows on two sides (cross-ventilation)</span>
          </label>
          <label class="check">
            <input id="curtains" type="checkbox" />
            <span data-i18n="curtains">I close curtains or blinds when the sun is on the window</span>
          </label>
          <label class="check">
            <input id="damp" type="checkbox" />
            <span data-i18n="damp">Damp or monsoon mode</span>
          </label>
          <label class="check">
            <input id="sensitive" type="checkbox" />
            <span data-i18n="sensitive">Asthma, allergies or sensitive lungs (stricter air limit, AQI 50)</span>
          </label>
          <label class="check">
            <input id="pollenAllergy" type="checkbox" />
            <span data-i18n="pollen_allergy">Pollen allergy (keep the window shut when pollen is high; pollen data covers Europe only)</span>
          </label>
          <p class="group-h" data-i18n="display_h">Display</p>
          <label class="check">
            <input id="simple" type="checkbox" />
            <span data-i18n="simple">Simple view: just the answer</span>
          </label>
          <label class="check">
            <input id="contrast" type="checkbox" />
            <span data-i18n="contrast">High contrast</span>
          </label>
          <label class="check">
            <input id="large" type="checkbox" />
            <span data-i18n="large">Larger text</span>
          </label>
          <p class="group-h" data-i18n="hook_h">Smart home (advanced)</p>
          <label class="wide"><span data-i18n="hook_label">Webhook URL to call when it's time to open or close</span>
            <input id="webhook" type="url" inputmode="url" placeholder="https://…" autocomplete="off" />
          </label>
          <p class="small wide" data-i18n="hook_help"></p>
          <div class="row wide"><button type="button" class="ghost" id="hook-test" data-i18n="hook_test">Send a test</button></div>
          <p class="group-h" data-i18n="energy_h">AC savings estimate</p>
          <label><span data-i18n="tariff">Electricity price per kWh</span>
            <input id="tariff" type="number" step="0.5" min="0" max="1000" />
          </label>
          <label><span data-i18n="currency">Currency symbol</span>
            <input id="currency" type="text" maxlength="4" />
          </label>
          <label><span data-i18n="ac_kw">AC power use (kWh per hour)</span>
            <input id="acKw" type="number" step="0.1" min="0.2" max="5" />
          </label>
        </div>
      </details>

      <details class="card calib">
        <summary data-i18n="calib_title">Calibrate to your room (optional)</summary>
        <p class="small" data-i18n="calib_help"></p>
        <form id="calib-form" class="fields">
          <label><span data-i18n="calib_temp">Room temperature now (°C)</span>
            <input id="calibTemp" type="number" step="0.1" min="0" max="50" required />
          </label>
          <label><span data-i18n="calib_since">Since your last reading, the window was</span>
            <select id="calibOpen">
              <option value="closed" data-i18n="calib_closed">Mostly closed</option>
              <option value="open" data-i18n="calib_open">Mostly open</option>
            </select>
          </label>
          <div class="row"><button type="submit" data-i18n="calib_log">Log reading</button>
          <button type="button" class="ghost" id="calib-reset" data-i18n="reset">Reset</button></div>
        </form>
        <div class="row bt-row" id="bt-row" hidden>
          <button type="button" class="ghost" id="bt-read" data-i18n="bt_read">📶 Read from a Bluetooth thermometer</button>
          <p class="small" data-i18n="bt_help"></p>
        </div>
        <label class="check share-room"><input id="shareRoom" type="checkbox" /> <span data-i18n="community_share">Share my room's calibration anonymously</span></label>
        <p id="calib-status" class="small" aria-live="polite"></p>
        <div id="calib-log"></div>
      </details>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="out"></div>
    </main>

    <footer class="wrap foot">
      <p id="footer-text"></p>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
